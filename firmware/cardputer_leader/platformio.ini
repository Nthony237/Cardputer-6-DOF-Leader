; PlatformIO project for the Cardputer ADV leader firmware.
; Build + flash from this folder:  pio run -t upload   then   pio device monitor
[env:cardputer-adv]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5Unified@^0.2.11
